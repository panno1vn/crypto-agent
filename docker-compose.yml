version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_agent}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB:-crypto_agent},airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-crypto_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: crypto_airflow
    restart: always
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      PYTHONPATH: /opt/airflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_agent}
      POSTGRES_HOST: postgres
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      SENTIMENT_ENGAGEMENT_SCALE: "40"
      # --- Ngày 23: RAG / ChromaDB ---
      # CHROMA_HOST=chroma (tên service, KHÔNG phải localhost — default
      # của rag/config.py là 'localhost', đúng cho host WSL2 nhưng SAI
      # trong container, sẽ trỏ về chính container airflow).
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: telegram_messages
      # Phải khớp CHÍNH XÁC giá trị trong .env local (dùng cho CLI/host).
      # Lệch 1 trong 2 biến này sẽ bị EnrichFingerprintMismatchError chặn
      # ngay ở get_collection() — xem rag/vector_store.py.
      ENRICH_INCLUDE_TIME: "false"
      ENRICH_INCLUDE_ENGAGEMENT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data_pipeline:/opt/airflow/data_pipeline
      - ./technical_analysis:/opt/airflow/technical_analysis
      - ./nlp:/opt/airflow/nlp
      - ./rag:/opt/airflow/rag
      - ./models:/opt/airflow/models:ro
      - ./logs/airflow:/opt/airflow/logs
      - ./crypto_session_dag_catchup.session:/opt/airflow/crypto_session_dag_catchup.session
      - huggingface_cache:/home/airflow/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: crypto_mlflow
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Named volume, KHÔNG bind ./mlflow_data: Docker Desktop tự bật container
      # (restart: always) trước khi WSL sẵn sàng → bind thư mục bị thay im lặng
      # bằng tmpfs, mất sạch run mỗi lần restart (2026-08-07 → 10-09).
      # Kiểm: scripts/manual/preflight_mlflow.py
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: crypto_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

volumes:
  postgres_data:
  huggingface_cache:
  chroma_data:
  mlflow_data:
